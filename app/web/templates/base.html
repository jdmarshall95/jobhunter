<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}jobhunter{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="/">jobhunter</a>
    <nav class="nav">
      <a href="/">лента</a>
      <a href="/?channel=hrlunapark">luna park</a>
      <a href="/?status=saved">сохранённые</a>
      <a href="/?status=applied">воронка</a>
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
