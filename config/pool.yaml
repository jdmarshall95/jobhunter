      roles (memcache, media converters, Rocket.Chat, Cassandra, backups, monitoring,
      deploy). Landed 140+ commits (~5k lines / 400+ file touches) so infra changes
      ship as reviewed code instead of one-off SSH edits."
  - id: funflow_migrations
    tags:
    - reliability
    - linux
    - devops
    text: "Platform carried overlapping HA stacks and a long tail of Xen/LVS/converter
      debt that raised ops cost and failure modes. Migrated Memcached Corosync → Keepalived
      across 10 nodes, Docker → Podman, and Xen → Proxmox (incl. cpupower-tuned app
      nodes), then retired 40+ legacy hosts. Added randomized salt-minion restart timers,
      SMART/RO-fs alerting and recovery playbooks so remaining fleet stays operable
      without surprise regressions."
  - id: funflow_delivery_flow
    tags:
    - iac
    - cicd
    - process
    - devops
    text: "New hosts used to land via bespoke pillar edits with weak review and painful
      hotfixes. Standardized base pillar → full pillar → prod-env switchover with MR
      review, ticket-linked commits and cherry-pick hotfix flow. Onboarding became a
      reproducible pipeline and infra changes are reviewable like application code."
  - id: funflow_platform
    tags:
    - cicd
    - observability
    - database
    - devops
    text: "CI/CD and data platforms were fragmented across aging Jenkins slaves, mixed
      artifact repos and loosely monitored Kafka/BI paths. Refactored Jenkins (pinned
      Java 17/21/25 agents, Rocket.Chat build pipeline, legacy slaves retired), ran
      GitLab CI runner fleet / TeamCity / Artifactory switchover, and wired Kafka topic
      provisioning plus Datadog consumer-group monitoring for BI/casino pipelines.
      Kept OpenSearch, ClickHouse, Trino, Metabase/Tableau, PostgreSQL/MySQL and the
      Datadog/Zabbix/VictoriaMetrics/Vector stack production-ready for product teams."
  - id: funflow_observability
    tags:
    - observability
    - reliability
    - devops
    text: "Fleet issues (disk failure, RO filesystems, stuck highstates, silent minion
      loss) were often discovered late via tickets. Authored vmalert rule sets in Salt
      (Cassandra, memcache, RO-fs, smartctl, disk filters), shipped exporters for smartctl/
      memcached/Cassandra/Java heap, and added highstate-duration + minion-down signals
      plus Graylog inputs for new services — config drift and hardware risk became alerts
      instead of outages."
  - id: funflow_network
    tags:
    - networking
    - linux
    - devops
    text: "Multi-site growth needed safer segmentation and recoverable edge without
      slowing product delivery. Fixed BIRD/OSPF tunnel weights/failover, rolled out
      VLAN 220 with ipset/iptables cross-VLAN ACLs, stood up Kea DHCP (HA) + FreeRADIUS/
      LDAP and split-horizon dns-recursor for ADMAN, and automated router backup via
      Oxidized → Git/Ceph. Hardened nginx/Angie + Squid/CloudFront edge (incl. HTTP/2
      on streaming nodes) so east-west and public exposure stay explicit and auditable."
  - id: funflow_services
    tags:
    - devops
    - product
    - database
    text: "Product needed collaboration, media and internal tools without waiting on
      SaaS lead times or uncontrolled snowflake hosts. Took Rocket.Chat (HA MongoDB +
      arbiter), Jitsi/Prosody, image-analyze + Elasticsearch, stats-receiver fleet,
      media-converter farm, NetBox, Growi and aptly to production with monitoring and
      lifecycle cleanup — teams got working services instead of DIY infra."
  - id: funflow_llm
    tags:
    - ai
    - gpu
    - automation
    text: "LLM inference on the GPU fleet was too slow for concurrent long-context
      product workloads. Deployed llama.cpp (`llama-server`) on 2× RTX 3080 Ti + 4×
      Tesla V100 and tuned flash attention, quantized KV cache and mlock — throughput
      32.4 → 74.8 tok/s with two concurrent 262K-token contexts, enabling self-hosted
      AI features without a per-token cloud bill."
  - id: funflow_moderation
    tags:
    - ai
    - product
    text: "Chat/media moderation depended on a large human team and external tooling,
      which did not scale with content volume. Brought NSFW moderation (text + image)
      fully in-house on self-hosted models and cut the moderation team 50 → 20 while
      keeping review inside the company's own infra boundary."
  - id: funflow_tts
    tags:
    - ai
    - product
    text: "In-app voiceover needed predictable latency and no per-minute SaaS spend
      or data egress. Deployed self-hosted TTS engines on the same GPU/ops model as
      other AI services so product could ship voice features under internal cost and
      compliance control."
